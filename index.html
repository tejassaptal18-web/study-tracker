<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b16">
<title>HSC 2027 Study Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070b16;--text:#e6ebf5;--text-dim:#93a0bd;--text-faint:#5f6b86;
  --glass:rgba(255,255,255,0.045);--glass-2:rgba(255,255,255,0.075);
  --border:rgba(255,255,255,0.09);--border-2:rgba(255,255,255,0.16);
  --shadow:0 10px 30px rgba(0,0,0,0.35);
  --accent:#6c8cff;--accent-2:#a78bfa;--green:#4fd1a5;--red:#ff6b6b;--yellow:#fbbf24;
  --topbar:rgba(7,11,22,0.72);--radius:18px;--radius-sm:12px;--sidebar-w:252px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme="light"]{
  --bg:#eef2fb;--text:#121a2b;--text-dim:#4c5876;--text-faint:#7d88a4;
  --glass:rgba(255,255,255,0.62);--glass-2:rgba(255,255,255,0.85);
  --border:rgba(20,35,70,0.08);--border-2:rgba(20,35,70,0.16);
  --shadow:0 10px 30px rgba(30,50,100,0.10);--topbar:rgba(238,242,251,0.75);
}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--text);background-color:var(--bg);
  background-image:
    radial-gradient(900px 500px at 8% -8%, rgba(108,140,255,0.20), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, rgba(167,139,250,0.18), transparent 55%),
    radial-gradient(900px 600px at 60% 110%, rgba(79,209,165,0.14), transparent 60%);
  background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5;
}
[data-theme="light"] body{
  background-image:
    radial-gradient(900px 500px at 8% -8%, rgba(108,140,255,0.18), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, rgba(167,139,250,0.16), transparent 55%),
    radial-gradient(900px 600px at 60% 110%, rgba(79,209,165,0.14), transparent 60%);
}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px}

body.logged-out .sidebar,body.logged-out .main,body.logged-out .scrim{display:none !important}
body:not(.logged-out) .login-screen{display:none !important}

/* ---------- LOGIN SCREEN ---------- */
.login-screen{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.login-card{width:100%;max-width:480px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border);border-radius:26px;padding:36px 28px 28px;text-align:center;box-shadow:var(--shadow);
  animation:loginIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes loginIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.login-logo{width:76px;height:76px;margin:0 auto 16px;border-radius:22px;display:grid;place-items:center;font-size:38px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 12px 32px rgba(108,140,255,0.42);
  animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 12px 32px rgba(108,140,255,0.42)}50%{box-shadow:0 14px 42px rgba(167,139,250,0.55)}}
.login-title{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-bottom:5px}
.login-sub{font-size:13px;color:var(--text-dim);margin-bottom:22px}
.login-divider{height:1px;background:var(--border);margin:0 0 22px}
.login-prompt{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:14px}
.user-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:20px;max-height:340px;overflow-y:auto;padding:2px}
.user-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 12px;
  background:var(--glass-2);border:1px solid var(--border);border-radius:16px;
  transition:transform .2s,border-color .2s,background .2s,box-shadow .2s;cursor:pointer;text-align:center}
.user-card:hover{transform:translateY(-3px);border-color:var(--border-2);background:var(--glass);box-shadow:0 10px 24px rgba(108,140,255,0.18)}
.user-card:active{transform:scale(.97)}
.user-card.loading{pointer-events:none;opacity:.6}
.user-avatar-big{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;color:#fff;
  box-shadow:0 8px 22px rgba(0,0,0,0.3);transition:transform .25s;position:relative}
.user-card:hover .user-avatar-big{transform:scale(1.06)}
.user-card-name{font-size:13.5px;font-weight:700;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-card-meta{font-size:10.5px;color:var(--text-faint);font-weight:500}
.login-add-btn{width:100%;margin-top:6px;padding:12px 16px}
.login-msg{font-size:12px;color:var(--text-faint);padding:14px;text-align:center;line-height:1.6;border-radius:12px}
.login-msg.error{color:var(--red);background:rgba(255,107,107,0.08);border:1px solid rgba(255,107,107,0.2);text-align:left}
.login-msg.warning{color:var(--yellow);background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);text-align:left;font-size:12px}
.login-msg button{margin-top:10px;color:var(--accent);font-weight:700;font-size:12px;text-decoration:underline}
.login-msg .help-link{display:inline-block;margin-top:8px;font-size:11.5px;color:var(--accent);text-decoration:underline}
.login-msg code{background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:4px;font-size:11px;color:var(--text)}
.login-skeleton{height:112px;border-radius:16px;
  background:linear-gradient(90deg,var(--glass-2) 25%,var(--border-2) 50%,var(--glass-2) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.offline-banner{background:rgba(108,140,255,0.12);border:1px solid rgba(108,140,255,0.28);border-radius:12px;
  padding:10px 14px;font-size:12px;color:var(--text-dim);margin-bottom:16px;display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.offline-banner button{color:var(--accent);font-weight:700;font-size:11.5px;text-decoration:underline}

/* ---------- MODAL ---------- */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:600;align-items:center;justify-content:center;padding:20px}
.modal-backdrop.show{display:flex;animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:390px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border-2);border-radius:22px;padding:26px;box-shadow:var(--shadow);
  animation:modalPop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes modalPop{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
.modal h3{font-size:19px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px}
.modal p{font-size:12.5px;color:var(--text-dim);margin-bottom:16px}
.modal input{width:100%;margin-bottom:6px}
.modal-error{font-size:12px;color:var(--red);min-height:16px;margin-bottom:12px;font-weight:600}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}

/* ---------- SIDEBAR ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:var(--glass);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 14px;z-index:70;overflow-y:auto;transition:transform .3s ease}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 18px;border-bottom:1px solid var(--border);margin-bottom:14px}
.user-avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:800;color:#fff;
  flex-shrink:0;box-shadow:0 6px 16px rgba(0,0,0,0.28);position:relative}
.user-avatar::after{content:"";position:absolute;bottom:-2px;right:-2px;width:11px;height:11px;border-radius:50%;
  background:var(--green);border:2px solid var(--bg);box-shadow:0 0 6px var(--green)}
.brand-info{flex:1;min-width:0}
.brand-title{font-size:14px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:10.5px;color:var(--text-faint);margin-top:1px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav-section{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--text-faint);font-weight:700;margin:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:var(--text-dim);
  font-size:13.5px;font-weight:500;text-align:left;width:100%;transition:background .18s,color .18s,transform .12s}
.nav-item:hover{background:var(--glass-2);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(108,140,255,0.22),rgba(167,139,250,0.14));color:var(--text);font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(108,140,255,0.28)}
.nav-ico{width:20px;text-align:center;font-size:15px;flex-shrink:0}
.sidebar-foot{padding-top:12px;margin-top:10px;border-top:1px solid var(--border)}
.sync-status{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:9px;
  background:var(--glass-2);border:1px solid var(--border);font-size:11.5px;font-weight:600;color:var(--text-dim);
  margin-bottom:12px;transition:background .2s}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);
  transition:background .3s,box-shadow .3s;flex-shrink:0}
.sync-status.saving .sync-dot{background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:syncPulse 1s infinite}
.sync-status.saving .sync-text{color:var(--yellow)}
.sync-status.error .sync-dot{background:var(--red);box-shadow:0 0 8px var(--red)}
.sync-status.error .sync-text{color:var(--red)}
.sync-status.saved .sync-dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.sync-status.saved .sync-text{color:var(--green)}
.sync-status.offline .sync-dot{background:var(--text-faint);box-shadow:none}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.4}}
.side-progress-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim);margin-bottom:7px;font-weight:600}
.side-progress-label b{color:var(--text)}

/* ---------- MAIN ---------- */
.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:13px 26px;
  background:var(--topbar);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.topbar-title{font-size:17px;font-weight:800;letter-spacing:-.3px}
.topbar-actions{margin-left:auto;display:flex;gap:9px}
.hamburger{display:none;width:38px;height:38px;border-radius:10px;background:var(--glass-2);border:1px solid var(--border);font-size:17px;place-items:center}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--glass-2);border:1px solid var(--border);display:grid;place-items:center;
  font-size:16px;transition:.18s}
.icon-btn:hover{background:var(--glass);transform:translateY(-1px)}
.icon-btn.sm{width:30px;height:30px;font-size:13px;border-radius:8px}
.icon-btn.danger:hover{background:rgba(255,107,107,0.14);color:var(--red)}
.view{padding:24px 28px 70px;width:100%;max-width:1420px;margin:0 auto}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:65;opacity:0;pointer-events:none;transition:opacity .3s}
body.sidebar-open .scrim{opacity:1;pointer-events:auto}

/* ---------- COMMON ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.6px;display:flex;align-items:center;gap:10px}
.page-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.page-sub{font-size:13px;color:var(--text-dim);margin-top:4px}
.card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h3{font-size:15px;font-weight:700;letter-spacing:-.2px}
.muted{color:var(--text-faint);font-size:12px}
.empty{text-align:center;color:var(--text-faint);font-size:13px;padding:24px 10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:11px;font-size:13.5px;font-weight:600;
  border:1px solid var(--border);background:var(--glass-2);color:var(--text);transition:transform .12s,background .18s,box-shadow .18s}
.btn:hover{background:var(--glass);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;
  box-shadow:0 8px 20px rgba(108,140,255,0.32)}
.btn.danger{color:var(--red);border-color:rgba(255,107,107,0.3);background:rgba(255,107,107,0.1)}
.input{background:var(--glass-2);border:1px solid var(--border);border-radius:11px;padding:10px 13px;color:var(--text);
  outline:none;transition:.18s;width:100%}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,140,255,0.16)}
textarea.input{resize:vertical;min-height:70px;line-height:1.55}
select.input{cursor:pointer}

/* ---------- STAT ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:13px;margin-bottom:18px}
.stat-card{position:relative;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px 15px 13px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.stat-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));opacity:.85}
.stat-card:hover{transform:translateY(-3px);border-color:var(--border-2);box-shadow:var(--shadow)}
.stat-icon{font-size:20px;margin-bottom:7px}
.stat-value{font-size:23px;font-weight:800;letter-spacing:-.6px;line-height:1.15;word-break:break-word}
.stat-label{font-size:12px;color:var(--text-dim);margin-top:3px;font-weight:500}
.stat-sub{font-size:11px;color:var(--text-faint);margin-top:4px}

/* ---------- PROGRESS ---------- */
.progress-track{height:9px;background:var(--glass-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* ---------- MISC PAGES ---------- */
.focus-list{display:flex;flex-direction:column;gap:8px}
.focus-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;
  background:var(--glass-2);border:1px solid var(--border);font-size:13px}
.quote-card{margin-top:16px;padding:18px 22px;border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(108,140,255,0.14),rgba(167,139,250,0.10));
  border:1px solid rgba(108,140,255,0.22);font-size:14.5px;font-style:italic;color:var(--text);line-height:1.6}
.quote-card::before{content:"“";font-size:34px;line-height:0;vertical-align:-14px;margin-right:4px;color:var(--accent-2);font-style:normal}

/* ---------- SUBJECT ---------- */
.subject-summary{display:flex;flex-wrap:wrap;align-items:center;gap:20px;margin-bottom:16px}
.subject-summary .progress-wrap{flex:1;min-width:200px}
.subject-summary .progress-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);margin-bottom:8px;font-weight:600}
.subject-summary .progress-label b{color:var(--text);font-size:14px}
.mini-stats{display:flex;gap:10px}
.mini-stats > div{background:var(--glass-2);border:1px solid var(--border);border-radius:12px;padding:8px 16px;text-align:center;min-width:76px}
.mini-stats span{display:block;font-size:18px;font-weight:800;letter-spacing:-.4px}
.mini-stats small{font-size:10.5px;color:var(--text-faint)}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:180px}
.toolbar .filter{width:auto;min-width:160px}
.chapter{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;
  transition:border-color .2s,background .2s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chapter:hover{border-color:var(--border-2)}
.ch-top{display:flex;align-items:center;gap:12px}
.ch-num{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:var(--glass-2);color:var(--text-dim);flex-shrink:0;border:1px solid var(--border)}
.ch-name{flex:1;font-size:14px;font-weight:600;min-width:0}
.ch-status{padding:7px 10px;border-radius:9px;background:var(--glass-2);border:1px solid var(--border);
  font-size:12px;font-weight:600;cursor:pointer;outline:none;min-width:130px}
.ch-bottom{display:flex;align-items:center;gap:8px;margin-top:10px;padding-left:43px;flex-wrap:wrap}
.rev{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-dim);cursor:pointer;padding:4px 9px;border-radius:8px;
  background:var(--glass-2);border:1px solid var(--border);font-weight:600;transition:.15s}
.rev:hover{border-color:var(--border-2)}
.rev input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer;margin:0}
.notes-btn{margin-left:auto;font-size:11.5px;color:var(--text-dim);padding:5px 11px;border-radius:8px;
  background:var(--glass-2);border:1px solid var(--border);font-weight:600}
.notes-btn:hover{color:var(--text)}
.ch-notes{margin-top:10px}
.ch-notes textarea{min-height:70px;font-size:13px}

/* ---------- GOALS ---------- */
.goal-form{display:flex;gap:10px;flex-wrap:wrap}
.goal-form .grow{flex:1;min-width:200px}
.goal-form .input{width:auto}
.goal-form input[type=date]{min-width:150px}
.goal{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  background:var(--glass-2);border:1px solid var(--border);margin-bottom:9px;transition:.18s}
.goal:hover{border-color:var(--border-2)}
.goal.done{opacity:.6}
.goal.done .goal-text{text-decoration:line-through}
.goal-check{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--border-2);display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#fff;flex-shrink:0;transition:.18s}
.goal.done .goal-check{background:linear-gradient(135deg,var(--green),#3cb98f);border-color:transparent}
.goal-check:hover{border-color:var(--accent)}
.goal-text{flex:1;font-size:13.5px;font-weight:500;min-width:0;word-break:break-word}
.goal-edit{padding:6px 10px;font-size:13px}

/* ---------- REVISION / STREAK / LOGS / TABLE ---------- */
.rev-subject{margin-bottom:14px}
.rev-row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;
  border-bottom:1px solid var(--border);flex-wrap:wrap}
.rev-row:last-child{border-bottom:none}
.rev-name{flex:1;font-size:13px;min-width:140px}
.rev-checks{display:flex;gap:6px;flex-wrap:wrap}
.rev-checks label{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-dim);
  padding:3px 8px;border-radius:7px;background:var(--glass-2);border:1px solid var(--border);cursor:pointer;font-weight:600}
.rev-checks input{accent-color:var(--accent);width:12px;height:12px;cursor:pointer;margin:0}

function pad(n){ return String(n).padStart(2,'0'); }

function formatDate(s){ if(!s) return '—'; const d=parseDate(s); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }

function hexA(hex,a){ const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16); return 'rgba('+r+','+g+','+b+','+a+')'; }
function getStorageKey(userId){ return STORAGE_PREFIX + (userId||'_anon') + '_v1'; }

function nameToColor(name){ let h=0; for(let i=0;i<name.length;i++) h = name.charCodeAt(i) + ((h<<5)-h); return 'hsl('+(Math.abs(h)%360)+', 62%, 55%)'; }
function initials(name){ const p=String(name).trim().split(/\s+/); if(p.length>=2) return (p[0][0]+p[1][0]).toUpperCase(); return (name||'?').substring(0,2).toUpperCase(); }

/* -------- Firebase error formatter -------- */
function formatFirebaseError(e){
  if(!e) return 'Unknown error';
  const code = e.code || '';
  const msg  = (e.message || String(e)).toLowerCase();

  if (code === 'permission-denied' || msg.includes('permission') || msg.includes('insufficient')) {
    return 'Permission denied. Your Firestore security rules are blocking access. In Firebase Console → Firestore → Rules, set: allow read, write: if true; (test only).';
  }
  if (code === 'not-found' || msg.includes('not-found')) {
    return 'Firestore database not found. Open the Firebase Console → Firestore Database → Create database.';
  }
  if (code === 'unavailable' || msg.includes('unavailable') || msg.includes('network') || msg.includes('failed to fetch') || msg.includes('could not reach')) {
    return 'Cannot reach Firestore. Two likely causes: (1) Firestore Database hasn\'t been created in your Firebase Console yet, or (2) you\'re offline.';
  }
  if (code === 'failed-precondition') {
    return 'Firestore is not ready. Open the Firebase Console → Firestore Database → Create database.';
  }
  if (code === 'resource-exhausted') {
    return 'Firestore quota exceeded. Try again later.';
  }
  if (code === 'unauthenticated') {
    return 'Firestore requires auth. In the Firebase Console set Rules to: allow read, write: if true;';
  }
  return (e.code ? '['+e.code+'] ' : '') + (e.message || 'Connection error');
}

function chKey(sid,i){ return sid+':'+i; }
function getCh(sid,i){
  const k = chKey(sid,i);
  if(!state.chapters[k]) state.chapters[k] = { status:0, rev:[false,false,false,false], notes:'' };
  const d = state.chapters[k];
  if(!Array.isArray(d.rev)) d.rev = [false,false,false,false];
  return d;
}

/* ============================================================
   STATS
============================================================ */
function getStats(){
  let total=0, weightSum=0, doneChapters=0, mastered=0, inProgress=0, notStarted=0;
  let revDone=0, revTotal=0;
  const per = {};
  SUBJECTS.forEach(s=>{
    let w=0, done=0, rd=0, rt=0, mast=0, inp=0, ns=0;
    s.chapters.forEach((c,i)=>{
      const d = getCh(s.id,i);
      total++;
      const wt = d.status===0?0:d.status===1?0.5:1;
      w += wt; weightSum += wt;
      if(d.status>=2) done++;
      if(d.status===3) mast++;
      if(d.status===0) ns++;
      else if(d.status===1) inp++;
      d.rev.forEach(x=>{ rt++; if(x) rd++; });
    });
    doneChapters+=done; mastered+=mast; revDone+=rd; revTotal+=rt;
    inProgress+=inp; notStarted+=ns;
    per[s.id] = {
      weight:w, done, total:s.chapters.length, revDone:rd, revTotal:rt, mastered:mast,
      pct: s.chapters.length ? (w/s.chapters.length)*100 : 0,
      revPct: rt ? (rd/rt)*100 : 0
    };
  });
  return { total, weightSum, doneChapters, mastered, inProgress, notStarted,
    revDone, revTotal,
    progressPct: total ? (weightSum/total)*100 : 0,
    revPct: revTotal ? (revDone/revTotal)*100 : 0, per };
}

function getStudy(){
  const byDate = {};
  let total = 0;
  state.logs.forEach(l=>{
    const h = Number(l.hours)||0;
    if(h<=0) return;
    total += h;
    byDate[l.date] = (byDate[l.date]||0) + h;
  });
  const today = new Date(); today.setHours(0,0,0,0);
  const tStr = dateStr(today);
  const weekStart = dateStr(new Date(today.getTime()-6*86400000));
  const monthStart = dateStr(new Date(today.getTime()-29*86400000));
  const yearStart = today.getFullYear()+'-01-01';
  let week=0, month=0, year=0, todayH=0;
  Object.keys(byDate).forEach(d=>{
    const h = byDate[d];
    if(d===tStr) todayH += h;
    if(d>=weekStart && d<=tStr) week += h;
    if(d>=monthStart && d<=tStr) month += h;
    if(d>=yearStart) year += h;
  });
  return { total, byDate, week, month, year, today: todayH };
}

function getStreaks(){
  const dates = new Set(state.logs.filter(l=>Number(l.hours)>0).map(l=>l.date));
  if(!dates.size) return { current:0, best:0 };
  const sorted = Array.from(dates).sort();
  let best = 1, run = 1;
  for(let i=1;i<sorted.length;i++){
    if(daysBetween(parseDate(sorted[i-1]), parseDate(sorted[i]))===1){ run++; if(run>best) best = run; }
    else run = 1;
  }
  let current = 0;
  let d = new Date(); d.setHours(0,0,0,0);
  if(!dates.has(dateStr(d))) d = new Date(d.getTime()-86400000);
  while(dates.has(dateStr(d))){ current++; d = new Date(d.getTime()-86400000); }
  return { current, best };
}

function consistencyScore(study){
  const today = new Date(); today.setHours(0,0,0,0);
  let days = 0;
  for(let i=0;i<30;i++){
    const ds = dateStr(new Date(today.getTime()-i*86400000));
    if((study.byDate[ds]||0) > 0) days++;
  }
  return (days/30)*100;
}

function goalCompletionRate(){
  const today = new Date(); today.setHours(0,0,0,0);
  const start = dateStr(new Date(today.getTime()-6*86400000));
  const t = dateStr(today);
  const gs = state.goals.filter(g=>g.date>=start && g.date<=t);
  if(!gs.length) return 0;
  return (gs.filter(g=>g.done).length / gs.length)*100;
}

function productivityScore(stats, study){
  return Math.round(consistencyScore(study)*0.4 + stats.revPct*0.3 + goalCompletionRate()*0.3);
}

function predict(stats){
  const start = parseDate(state.startDate);
  const now = new Date(); now.setHours(0,0,0,0);
  const elapsed = Math.max(1, daysBetween(start, now) + 1);
  const rate = stats.weightSum / elapsed;
  const remaining = stats.total - stats.weightSum;
  if(remaining <= 0) return { done:true, date:null, daysAhead:0 };
  if(rate <= 0) return { unknown:true };
  const daysNeeded = remaining / rate;
  const predDate = new Date(now.getTime() + daysNeeded*86400000);
  return { date: predDate, daysAhead: daysBetween(predDate, TARGET), rate, requiredRate: remaining/Math.max(1, daysBetween(now,TARGET)) };
}

function checkAchievements(stats, study, streaks){
  const unlocked = new Set(state.achievements);
  const newly = [];
  ACHIEVEMENTS.forEach(a=>{
    if(unlocked.has(a.id)) return;
    let ok = false;
    try{ ok = a.check({ stats, study, streaks }); }catch(e){}
    if(ok){ unlocked.add(a.id); newly.push(a); }
  });
  if(newly.length){ state.achievements = Array.from(unlocked); save(); }
  return newly;
}

   LOGIN / USER MANAGEMENT (local-first, Firebase-optional)
============================================================ */
async function fetchUsers(){
  const result = { users: [], firebaseError: null, source: 'firebase' };

  // 1) Try Firestore first (unless offline mode)
  if (!offlineMode && firebaseReady && db) {
    try {
      const snap = await db.collection('users').get();
      result.users = snap.docs.map(d => ({ id: d.id, name: (d.data().name) || d.id }));
      result.users.sort((a,b) => (a.name||'').localeCompare(b.name||''));
      try{ localStorage.setItem(USERS_CACHE_KEY, JSON.stringify(result.users)); }catch(e){}
      return result;
    } catch(e){
      console.warn('Firestore fetch failed, falling back to cache:', e);
      result.firebaseError = formatFirebaseError(e);
      result.rawError = e;
      result.source = 'cache';
    }
  } else if (!offlineMode && !firebaseReady) {
    result.firebaseError = 'Firebase SDK not loaded. Check your internet connection.';
    result.source = 'cache';
  } else if (offlineMode) {
    result.source = 'offline';
  }

  // 2) Fall back to local cache
  try {
    const raw = localStorage.getItem(USERS_CACHE_KEY);
    if (raw) {
      const cached = JSON.parse(raw);
      if (Array.isArray(cached)) result.users = cached;
    }
  } catch(e) {}

  return result;
}

async function loginUser(userId){
  const grid = $('userGrid');
  if(grid) grid.querySelectorAll('.user-card').forEach(c=>{
    if(c.dataset.userId === userId) c.classList.add('loading');
  });

  let data = null, name = null;

  // Try Firestore (unless offline)
  if (!offlineMode && firebaseReady && db) {
    try {
      const doc = await db.collection('users').doc(userId).get();
      if (doc.exists) {
        data = doc.data();
        name = data.name || userId;
      }
    } catch(e) {
      console.warn('Firestore load failed, will use local cache:', e);
      showToast('⚠ Cloud offline — using local data');
    }
  }

  // Fallback to local
  if (!data) {
    try {
      const raw = localStorage.getItem(getStorageKey(userId));
      if (raw) {
        data = { state: JSON.parse(raw) };
        try {
          const uc = JSON.parse(localStorage.getItem(USERS_CACHE_KEY) || '[]');
          const u = uc.find(x => x.id === userId);
          if (u) name = u.name;
        } catch(e){}
        name = name || userId;
      }
    } catch(e){}
  }

  if (!data) {
    showToast('Could not load profile');
    if(grid) grid.querySelectorAll('.user-card').forEach(c=>c.classList.remove('loading'));
    return;
  }

  currentUser = { id: userId, name: name || userId };
  state = Object.assign(defaultState(), data.state || {});
  try{ localStorage.setItem(LAST_USER_KEY, userId); }catch(e){}

  document.body.classList.remove('logged-out');
  document.body.classList.remove('sidebar-open');
  buildNav();
  applyTheme();
  updateUserBadge();
  setSyncStatus(offlineMode ? 'offline' : (firebaseReady ? 'saved' : 'offline'));
  render();
}

/* ---------- Local-first profile creation ---------- */
async function createNewUser(name){
  const trimmed = String(name||'').trim();
  if(!trimmed) throw new Error('Please enter a name');
  if(trimmed.length < 2) throw new Error('Name must be at least 2 characters');
  const id = slugify(trimmed);
  if(!id) throw new Error('Invalid name');

  // 1) Check local cache for duplicates
  let users = [];
  try { users = JSON.parse(localStorage.getItem(USERS_CACHE_KEY) || '[]'); } catch(e){}
  if (users.find(u => u.id === id)) throw new Error('A profile with this name already exists');

  const localState = defaultState();

  // 2) Always save locally first
  try {
    localStorage.setItem(getStorageKey(id), JSON.stringify(localState));
    users.push({ id, name: trimmed });
    users.sort((a,b) => (a.name||'').localeCompare(b.name||''));
    localStorage.setItem(USERS_CACHE_KEY, JSON.stringify(users));
  } catch(e) {
    console.warn('Local save failed', e);
    throw new Error('Could not save locally — browser storage may be full or blocked');
  }

  // 3) Try to sync to Firebase (best effort)
  let syncStatus = 'local';
  let syncError = null;

  if (!offlineMode && firebaseReady && db) {
    try {
      const ref = db.collection('users').doc(id);
      const doc = await ref.get();
      if (doc.exists) {
        // Profile already exists in Firestore — accept it (data merge will happen on login)
        syncStatus = 'existing';
      } else {
        await ref.set({
          name: trimmed,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          state: localState
        });
        syncStatus = 'synced';
      }
    } catch(e) {
      console.warn('Firebase create failed (profile kept locally):', e);
      syncStatus = 'local-only';
      syncError = e;
    }
  } else {
    syncStatus = 'offline';
  }

  return { id, syncStatus, syncError };
}

function logout(){
  if(!confirm('Switch to another profile? Your current progress is saved.')) return;

  // Force-save current state
  if(currentUser){
    try{ localStorage.setItem(getStorageKey(currentUser.id), JSON.stringify(state)); }catch(e){}
    if(!offlineMode && firebaseReady && db){
      db.collection('users').doc(currentUser.id).update({
        state: state,
        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(e=>console.warn('Final sync failed', e));
    }
  }

  currentUser = null;
  state = defaultState();
  goalDate = todayStr();
  destroyCharts();
  document.body.classList.add('logged-out');
  document.body.classList.remove('sidebar-open');
  initLogin();
}

async function handleCreateNewUser(){
  const name = $('newUserName').value.trim();
  const errEl = $('newUserError');
  const btn = $('createNewUser');
  errEl.textContent = '';
  errEl.style.color = '';
  btn.disabled = true;
  btn.textContent = 'Creating…';

  try{
    const result = await createNewUser(name);
    hideNewUserModal();

    // Refresh user grid
    try{
      const fresh = await fetchUsers();
      renderUserGrid(fresh.users, fresh.firebaseError);
    }catch(e){}

    await loginUser(result.id);

    if (result.syncStatus === 'synced') {
      showToast('✅ Profile created and synced to cloud');
    } else if (result.syncStatus === 'existing') {
      showToast('Profile already existed in cloud — using it');
    } else if (result.syncStatus === 'local-only') {
      const reason = result.syncError ? formatFirebaseError(result.syncError) : 'Firebase unavailable';
      showToast('⚠ Profile created locally. Cloud sync unavailable.');
      console.warn('Cloud sync failed:', reason);
    } else if (result.syncStatus === 'offline') {
      showToast('📴 Profile created in local mode');
    } else {
      showToast('Profile created ✓');
    }
  } catch(e){
    errEl.style.color = 'var(--red)';
    errEl.textContent = e.message || 'Failed to create profile';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Profile';
  }
}

async function initLogin(){
  document.body.classList.add('logged-out');
  const grid = $('userGrid');
  if(grid) grid.innerHTML = '<div class="login-skeleton"></div><div class="login-skeleton"></div>';
  const msg = $('loginMsg');
  if(msg){ msg.style.display = 'none'; msg.textContent = ''; }

  // Wire once
  if(!initLogin._wired){
    initLogin._wired = true;
    $('addUserBtn').addEventListener('click', showNewUserModal);
    $('cancelNewUser').addEventListener('click', hideNewUserModal);
    $('createNewUser').addEventListener('click', handleCreateNewUser);
    $('newUserModal').addEventListener('click', (e)=>{ if(e.target.id === 'newUserModal') hideNewUserModal(); });
    $('newUserName').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter') handleCreateNewUser();
      if(e.key === 'Escape') hideNewUserModal();
    });
    $('userGrid').addEventListener('click', (e)=>{
      const card = e.target.closest('.user-card');
      if(card && card.dataset.userId && !card.classList.contains('loading')) loginUser(card.dataset.userId);
    });
    $('logoutBtn').addEventListener('click', logout);
  }

  try{
    const result = await fetchUsers();
    renderUserGrid(result.users, result.firebaseError);
  }catch(e){
    renderLoginError(e);
  }
}

function streakHTML(stats, study, streaks){
  const cons = consistencyScore(study);
  const prod = productivityScore(stats, study);
  const today = new Date(); today.setHours(0,0,0,0);
  const cells = [];
  for(let i=69;i>=0;i--){
    const d = new Date(today.getTime()-i*86400000);
    const ds = dateStr(d);
    const h = study.byDate[ds] || 0;
    let level = 0;
    if(h>0 && h<1) level = 1;
    else if(h>=1 && h<2.5) level = 2;
    else if(h>=2.5 && h<4.5) level = 3;
    else if(h>=4.5) level = 4;
    cells.push('<div class="heat-cell l'+level+'" title="'+formatDate(ds)+' — '+h.toFixed(1)+'h"></div>');
  }
  return '<div class="page-head"><div><div class="page-title">🔥 Study Streak</div>' +
    '<div class="page-sub">Consistency beats intensity. Show up every day.</div></div></div>' +
  '<div class="stat-grid">' +
    statCard('🔥','Current Streak', streaks.current+' day'+(streaks.current===1?'':'s'), 'keep the fire alive') +
    statCard('🏆','Best Streak', streaks.best+' day'+(streaks.best===1?'':'s'), 'personal record') +
    statCard('📈','Consistency Score', cons.toFixed(0)+'%', 'last 30 days') +
    statCard('⚡','Productivity Score', prod+'%', 'goals • revisions • consistency') +
    statCard('⏱️','Today', study.today.toFixed(1)+'h', 'studied so far') + '</div>' +
  '<div class="card"><div class="card-head"><h3>Last 70 Days</h3><span class="muted">Hover a cell for details</span></div>' +
    '<div class="heatmap">'+cells.join('')+'</div>' +
    '<div class="heat-legend"><span>Less</span>' +
      '<div class="heat-cell l0"></div><div class="heat-cell l1"></div><div class="heat-cell l2"></div>' +
      '<div class="heat-cell l3"></div><div class="heat-cell l4"></div><span>More</span></div></div>';
}

function afterAnalytics(stats, study){
  if(typeof Chart === 'undefined'){
    const fb = $('chartFallback'); if(fb) fb.style.display = 'block';
    return;
  }
  destroyCharts();
  const isDark = document.documentElement.dataset.theme !== 'light';
  Chart.defaults.color = isDark ? '#93a0bd' : '#4c5876';
  Chart.defaults.borderColor = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(20,35,70,0.08)';
  Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
  Chart.defaults.font.size = 11.5;
  const labels = SUBJECTS.map(s=>s.name);
  const colors = SUBJECTS.map(s=>s.color);
  const grid = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(20,35,70,0.08)';

  charts.sp = new Chart($('chart-subj-progress'), {
    type:'bar', data:{ labels, datasets:[{ data: SUBJECTS.map(s=>+stats.per[s.id].pct.toFixed(1)),
      backgroundColor: colors.map(c=>hexA(c,0.65)), borderColor: colors, borderWidth:1.5, borderRadius:8, barThickness:26 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } },
      scales:{ y:{ beginAtZero:true, max:100, ticks:{ callback:v=>v+'%' }, grid:{ color:grid } }, x:{ grid:{ display:false } } } }
  });

  const today = new Date(); today.setHours(0,0,0,0);
  const dLabels = [], dData = [];
  for(let i=13;i>=0;i--){
    const d = new Date(today.getTime()-i*86400000);
    dLabels.push(d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}));
    dData.push(+(study.byDate[dateStr(d)]||0).toFixed(2));
  }
  charts.daily = new Chart($('chart-daily'), {
    type:'line', data:{ labels:dLabels, datasets:[{ data:dData, borderColor:'#4f8cff', backgroundColor:hexA('#4f8cff',0.18),
      fill:true, tension:0.35, pointRadius:3, pointBackgroundColor:'#4f8cff', borderWidth:2 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } },
      scales:{ y:{ beginAtZero:true, ticks:{ callback:v=>v+'h' }, grid:{ color:grid } }, x:{ grid:{ display:false }, ticks:{ maxRotation:0, autoSkip:true, maxTicksLimit:7 } } } }
  });

  const wLabels = [], wData = [];
  for(let i=7;i>=0;i--){
    const end = new Date(today.getTime()-i*7*86400000);
    const start = new Date(end.getTime()-6*86400000);
    const s = dateStr(start), e = dateStr(end);
    let sum = 0;
    Object.keys(study.byDate).forEach(d=>{ if(d>=s && d<=e) sum += study.byDate[d]; });
    wLabels.push(start.toLocaleDateString('en-IN',{day:'numeric',month:'short'}));
    wData.push(+sum.toFixed(2));
  }
  charts.weekly = new Chart($('chart-weekly'), {
    type:'bar', data:{ labels:wLabels, datasets:[{ data:wData, backgroundColor:hexA('#a78bfa',0.7), borderColor:'#a78bfa',
      borderWidth:1.5, borderRadius:8, barThickness:22 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } },
      scales:{ y:{ beginAtZero:true, ticks:{ callback:v=>v+'h' }, grid:{ color:grid } }, x:{ grid:{ display:false }, ticks:{ maxRotation:0, autoSkip:false, font:{ size:10 } } } } }
  });

  const mLabels = [], mData = [];
  const nowY = today.getFullYear(), nowM = today.getMonth();
  for(let i=5;i>=0;i--){
    const d = new Date(nowY, nowM-i, 1);
    const prefix = d.getFullYear()+'-'+pad(d.getMonth()+1);
    let sum = 0;
    Object.keys(study.byDate).forEach(k=>{ if(k.indexOf(prefix)===0) sum += study.byDate[k]; });
    mLabels.push(d.toLocaleDateString('en-IN',{month:'short',year:'numeric'}));
    mData.push(+sum.toFixed(2));
  }
  charts.monthly = new Chart($('chart-monthly'), {
    type:'bar', data:{ labels:mLabels, datasets:[{ data:mData, backgroundColor:hexA('#4fd1a5',0.7), borderColor:'#4fd1a5',
      borderWidth:1.5, borderRadius:8, barThickness:30 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } },
      scales:{ y:{ beginAtZero:true, ticks:{ callback:v=>v+'h' }, grid:{ color:grid } }, x:{ grid:{ display:false } } } }
  });

  const subjHours = SUBJECTS.map(s=>{
    let h = 0;
    state.logs.forEach(l=>{ if(l.subject===s.id) h += Number(l.hours)||0; });
    return +h.toFixed(2);
  });
  charts.time = new Chart($('chart-subj-time'), {
    type:'doughnut', data:{ labels, datasets:[{ data: subjHours, backgroundColor: colors.map(c=>hexA(c,0.75)),
      borderColor: colors, borderWidth:1.5, hoverOffset:8 }]},
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{ legend:{ position:'bottom', labels:{ padding:14, usePointStyle:true, pointStyle:'circle' } } } }
  });

  charts.rev = new Chart($('chart-rev'), {
    type:'bar', data:{ labels, datasets:[{ data: SUBJECTS.map(s=>+stats.per[s.id].revPct.toFixed(1)),
      backgroundColor: colors.map(c=>hexA(c,0.65)), borderColor: colors, borderWidth:1.5, borderRadius:8, barThickness:26 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } },
      scales:{ y:{ beginAtZero:true, max:100, ticks:{ callback:v=>v+'%' }, grid:{ color:grid } }, x:{ grid:{ display:false } } } }
  });
}

function render(){
  if(!currentUser) return;
  const y = window.scrollY;
  const stats = getStats();
  const study = getStudy();
  const streaks = getStreaks();
  const newly = checkAchievements(stats, study, streaks);
  newly.forEach(a => showToast(a.icon+' Achievement unlocked: '+a.name));

  let html = '', title = 'Dashboard';
  if(currentPage === 'dashboard'){ html = dashboardHTML(stats, study, streaks); title = 'Dashboard'; }
  else if(['physics','chemistry','maths','biology'].indexOf(currentPage) !== -1){
    const s = SUBJECTS.find(x=>x.id===currentPage);
    html = subjectHTML(s, stats); title = s.name;
  }
  else if(currentPage === 'goals'){ html = goalsHTML(); title = 'Daily Goals'; }
  else if(currentPage === 'revision'){ html = revisionHTML(stats); title = 'Revision Tracker'; }
  else if(currentPage === 'streak'){ html = streakHTML(stats, study, streaks); title = 'Study Streak'; }
  else if(currentPage === 'logs'){ html = logsHTML(study); title = 'Study Logs'; }
  else if(currentPage === 'analytics'){ html = analyticsHTML(); title = 'Analytics'; }
  else if(currentPage === 'achievements'){ html = achievementsHTML(); title = 'Achievements'; }
  else if(currentPage === 'backup'){ html = backupHTML(); title = 'Backup & Restore'; }
  else if(currentPage === 'settings'){ html = settingsHTML(); title = 'Settings'; }
  else html = dashboardHTML(stats, study, streaks);

  $('view').innerHTML = html;
  $('topbar-title').textContent = title;
  $('side-pct').textContent = stats.progressPct.toFixed(0)+'%';
  $('side-fill').style.width = stats.progressPct+'%';

  if(currentPage === 'analytics') afterAnalytics(stats, study);
  if(['physics','chemistry','maths','biology'].indexOf(currentPage) !== -1) filterChapters(currentPage);

  updateNav();
  window.scrollTo(0, y);
}

/* ============================================================
   EVENTS
============================================================ */
const view = $('view');

view.addEventListener('submit', e=>{
  const form = e.target;
  if(form.dataset.form === 'goal-add'){
    e.preventDefault();
    const date = form.elements.date.value, text = form.elements.text.value.trim();
    if(!date || !text) return;
    state.goals.push({ id:'g'+Date.now()+Math.random().toString(36).slice(2,6), date, text, done:false, created:Date.now() });
    goalDate = date; save(); render(); showToast('Goal added ✓');
  }
  if(form.dataset.form === 'log-add'){
    e.preventDefault();
    const date = form.elements.date.value, subject = form.elements.subject.value;
    const hours = parseFloat(form.elements.hours.value);
    if(!date || !subject || !isFinite(hours) || hours <= 0) return;
    state.logs.push({ id:'l'+Date.now()+Math.random().toString(36).slice(2,6), date, subject, hours, created:Date.now() });
    save(); render(); showToast('Study log added ✓');
  }
});

view.addEventListener('change', e=>{
  const t = e.target, action = t.dataset.action;
  if(action === 'ch-status'){
    getCh(t.dataset.sid, Number(t.dataset.idx)).status = Number(t.value);
    save(); render(); return;
  }
  if(action === 'ch-rev'){
    getCh(t.dataset.sid, Number(t.dataset.idx)).rev[Number(t.dataset.rev)] = t.checked;
    save(); render(); return;
  }
  if(action === 'ch-filter'){ ui.filter[t.dataset.sid] = t.value; filterChapters(t.dataset.sid); return; }
  if(action === 'goal-date'){ goalDate = t.value || todayStr(); render(); return; }
  if(action === 'start-date'){ if(t.value){ state.startDate = t.value; save(); render(); } return; }
  if(action === 'import-file'){
    const file = t.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!data || typeof data !== 'object') throw new Error('bad');
        state = Object.assign(defaultState(), data);
        applyTheme(); save(); render(); showToast('Backup imported ✓');
      }catch(err){ showToast('Invalid backup file'); }
    };
    reader.readAsText(file); t.value = ''; return;
  }
});

view.addEventListener('input', e=>{
  const t = e.target, action = t.dataset.action;
  if(action === 'ch-search'){ ui.search[t.dataset.sid] = t.value; filterChapters(t.dataset.sid); return; }
  if(action === 'ch-notes'){ getCh(t.dataset.sid, Number(t.dataset.idx)).notes = t.value; saveDebounced(); return; }
  if(action === 'quick-notes'){ state.quickNotes = t.value; saveDebounced(); return; }
});

view.addEventListener('click', e=>{
  const target = e.target.closest('[data-action]');
  if(!target) return;
  const action = target.dataset.action;

  if(action === 'toggle-notes'){
    const ch = target.closest('.chapter');
    if(ch){ const n = ch.querySelector('.ch-notes'); if(n) n.hidden = !n.hidden; }
    return;
  }
  if(action === 'goal-toggle'){
    const g = state.goals.find(x=>x.id===target.dataset.id);
    if(g){ g.done = !g.done; save(); render(); } return;
  }
  if(action === 'goal-del'){
    if(!confirm('Delete this goal?')) return;
    state.goals = state.goals.filter(x=>x.id!==target.dataset.id); save(); render(); return;
  }
  if(action === 'goal-edit'){ editGoal(target.dataset.id); return; }
  if(action === 'log-del'){
    if(!confirm('Delete this study log?')) return;
    state.logs = state.logs.filter(x=>x.id!==target.dataset.id); save(); render(); return;
  }
  if(action === 'export'){
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'hsc2027-'+(currentUser ? currentUser.id : 'backup')+'-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast('Backup exported ✓'); return;
  }
  if(action === 'import'){ const input = $('importFile'); if(input) input.click(); return; }
  if(action === 'toggle-theme'){ toggleTheme(); return; }
  if(action === 'switch-user'){ logout(); return; }
  if(action === 'toggle-offline'){ setOfflineMode(!offlineMode); render(); return; }
  if(action === 'test-sync'){
    if(!firebaseReady){ showToast('❌ Firebase SDK not available'); return; }
    if(offlineMode){ showToast('📴 Local mode — enable cloud first'); return; }
    setSyncStatus('saving');
    db.collection('users').doc(currentUser.id).get()
      .then(()=>{ setSyncStatus('saved'); showToast('✅ Firestore reachable and rules allow access'); })
      .catch(err=>{ setSyncStatus('error'); showToast('❌ ' + formatFirebaseError(err).slice(0, 140)); });
    return;
  }
  if(action === 'reset'){
    if(!confirm('Delete ALL data for this profile? This cannot be undone.')) return;
    state = defaultState(); goalDate = todayStr(); save(); render(); showToast('Profile data reset');
    return;
  }
});

function editGoal(id){
  const g = state.goals.find(x=>x.id===id);
  if(!g) return;
  const row = document.querySelector('.goal[data-id="'+id+'"]');
  if(!row) return;
  const textEl = row.querySelector('.goal-text');
  const input = document.createElement('input');
  input.type = 'text'; input.value = g.text; input.className = 'input goal-edit';
  textEl.textContent = ''; textEl.appendChild(input); input.focus(); input.select();
  let cancelled = false;
  input.addEventListener('keydown', ev=>{
    if(ev.key === 'Enter'){ ev.preventDefault(); input.blur(); }
    if(ev.key === 'Escape'){ cancelled = true; input.blur(); }
  });
  input.addEventListener('blur', ()=>{
    if(!cancelled){ const v = input.value.trim(); if(v){ g.text = v; save(); } }
    render();
  });
}

/* ============================================================
   THEME
============================================================ */
function applyTheme(){
  document.documentElement.dataset.theme = state.theme || 'dark';
  const btn = $('themeBtn');
  if(btn) btn.textContent = (state.theme === 'light') ? '☀️' : '🌙';
}
function toggleTheme(){
  state.theme = (state.theme === 'dark') ? 'light' : 'dark';
  applyTheme(); save();
  if(currentPage === 'analytics' || currentPage === 'settings') render();
}

/* ============================================================
   GLOBAL LISTENERS + INIT
============================================================ */
$('hamburger').addEventListener('click', ()=>document.body.classList.toggle('sidebar-open'));
$('scrim').addEventListener('click', ()=>document.body.classList.remove('sidebar-open'));
$('themeBtn').addEventListener('click', toggleTheme);
$('nav').addEventListener('click', e=>{
  const btn = e.target.closest('.nav-item');
  if(btn && currentUser) navigate(btn.dataset.page);
});

applyTheme();
initLogin();

})();
</script>
